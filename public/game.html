<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tenpile</title>
<meta name="theme-color" content="#523A2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  #seats { display: flex; gap: .4rem; padding: .55rem .6rem; overflow-x: auto; flex: 0 0 auto; }
  .seat { flex: 0 0 auto; background: rgba(0,0,0,.22); border-radius: 12px; padding: .35rem .6rem; min-width: 66px; }
  .seat .n { font-size: .72rem; font-weight: 500; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 76px; }
  .seat .c { font-size: 1.2rem; font-weight: 700; line-height: 1.1; }
  .seat.low .c { color: var(--alert); }
  .seat.me { box-shadow: inset 0 0 0 2px var(--gold); }

  #centre { flex: 1 1 auto; overflow-y: auto; padding: .6rem; display: grid; gap: .35rem;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); align-content: start;
            max-width: 780px; margin: 0 auto; width: 100%; }
  #centre .card { font-size: 1.05rem; }
  #centre .card.done { filter: saturate(.3) brightness(.6); }
  #centre .card.ok { outline: 3px solid var(--alert); outline-offset: 2px; }
  #centre .newpile { display: grid; place-items: center; gap: 1px; font-weight: 600; }
  #centre .newpile small { font-size: .5rem; letter-spacing: .06em; line-height: 1; }

  #mine { flex: 0 0 auto; background: rgba(0,0,0,.26); border-radius: 20px 20px 0 0;
          padding: .7rem .75rem calc(.7rem + env(safe-area-inset-bottom)); }
  .lanes { display: grid; grid-template-columns: 1fr auto auto; gap: .7rem; align-items: end; }
  .lane { display: flex; gap: .35rem; }
  .lane .card, #mine .card { width: 48px; font-size: 1.2rem; }
  .cap { font-size: .68rem; font-weight: 600; color: var(--dim); margin-bottom: .25rem; }
  .pile { position: relative; }
  .pile .badge { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
                 background: var(--rail); border-radius: 999px; font-size: .62rem; font-weight: 600;
                 padding: 0 .4rem; box-shadow: 0 2px 5px rgba(0,0,0,.4); }

  .drawbox { display: flex; gap: .35rem; align-items: stretch; }
  .flipbtn { width: 38px; border: none; border-radius: 10px; background: var(--gold); color: #2A1A0E;
             font-family: var(--font); font-size: 1rem; font-weight: 700; cursor: pointer; padding: 0;
             display: grid; place-items: center; box-shadow: 0 4px 0 var(--gold-deep); }
  .flipbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }
  .flipbtn:disabled { opacity: .4; box-shadow: none; }
  .flipbtn:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
  .flipbtn .n { font-size: .58rem; font-weight: 600; opacity: .75; display: block; }

  #hint { text-align: center; font-size: .8rem; font-weight: 500; color: var(--dim); padding: .1rem 0 .3rem; min-height: 1.3em; }

  #banner { position: absolute; inset: 0; display: none; place-items: center; background: rgba(38,25,17,.95); padding: 1.25rem; z-index: 5; }
  #banner.on { display: grid; }
  #banner .panel { max-width: 420px; width: 100%; }
</style>
</head>
<body>
<div id="seats" aria-label="Players"></div>
<div id="centre" aria-label="Centre piles"></div>
<div id="hint" role="status" aria-live="polite"></div>

<div id="mine">
  <div class="lanes">
    <div>
      <div class="cap">Ready piles</div>
      <div class="lane" id="ready"></div>
    </div>
    <div>
      <div class="cap">Race</div>
      <div class="pile" id="race"></div>
    </div>
    <div>
      <div class="cap">Draw</div>
      <div class="drawbox">
        <div class="pile" id="draw"></div>
        <button class="flipbtn" id="flip" aria-label="Turn three cards"></button>
      </div>
    </div>
  </div>
</div>

<div id="banner"><div class="panel stack" id="bannerBody"></div></div>

<script type="module">
import { COLOURS, colour, value, phase } from '/engine.js';

const code = location.hash.slice(1).toUpperCase();
if (!/^[A-Z2-9]{4}$/.test(code)) location.href = '/';
const name = (localStorage.getItem('tp.name') || 'Player').slice(0, 16);
let pid = localStorage.getItem('tp.pid');
if (!pid) { pid = crypto.randomUUID(); localStorage.setItem('tp.pid', pid); }

const $ = (id) => document.getElementById(id);
const els = { seats: $('seats'), centre: $('centre'), ready: $('ready'), race: $('race'), draw: $('draw'), hint: $('hint'), banner: $('banner'), body: $('bannerBody') };

let view = null, roster = null, seat = -1, sel = null, seq = 0, ws = null, backoff = 500;

const cardHTML = (c, extra = '') =>
  c === null || c === undefined
    ? `<div class="card empty ${extra}">–</div>`
    : `<div class="card ${COLOURS[colour(c)]} ${extra}"><span class="mark">${phase(c) ? '○' : '●'}</span>${value(c)}</div>`;

// ---- connection ------------------------------------------------------------

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${code}?name=${encodeURIComponent(name)}&pid=${pid}`);

  ws.addEventListener('open', () => { backoff = 500; els.hint.textContent = ''; });
  ws.addEventListener('message', (e) => handle(JSON.parse(e.data)));
  ws.addEventListener('close', () => {
    els.hint.textContent = 'Connection lost. Reconnecting…';
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 8000);
  });
  // Auto-response heartbeat: the server answers these without waking up.
  setInterval(() => { if (ws?.readyState === 1) ws.send('p'); }, 20000);
}

function send(obj) { if (ws?.readyState === 1) ws.send(JSON.stringify(obj)); }
const move = (m) => { sel = null; send({ t: 'move', seq: ++seq, move: m }); };

function handle(m) {
  if (m === 'q') return;
  if (m.t === 'you') { seat = m.seat; if (view) render(); return; }
  if (m.t === 'roster' || m.t === 'aborted') {
    roster = m;
    if (m.t === 'aborted') showBanner('Round ended early', 'The table lost its connection, so this round was cancelled. Scores from finished rounds are safe.', 'Back to the lobby', () => { hideBanner(); send({ t: 'start' }); });
    else if (m.phase === 'lobby') lobby();
    drawSeats();
  }
  if (m.t === 'begin') { hideBanner(); roster = { ...roster, round: m.round }; view = m.v; render(); }
  if (m.t === 'state') { view = m.v; render(); }
  if (m.t === 'reject') { els.hint.textContent = 'That card cannot go there.'; setTimeout(() => (els.hint.textContent = ''), 900); }
  if (m.t === 'slowdown') els.hint.textContent = 'Slow down a moment.';
  if (m.t === 'error') els.hint.textContent = m.m;
  if (m.t === 'roundEnd') { view = m.v; render(); roundEnd(m); }
}

// ---- rendering -------------------------------------------------------------

function drawSeats() {
  if (!roster) return;
  els.seats.innerHTML = roster.players.map((p, i) => {
    const left = view?.hands?.[i]?.raceLeft;
    return `<div class="seat ${i === seat ? 'me' : ''} ${left <= 3 ? 'low' : ''}">
      <div class="n">${esc(p.name)}</div>
      <div class="c">${left ?? '–'}<span style="font:400 .6rem var(--body);color:var(--dim);margin-left:.25rem">${p.total} pts</span></div>
    </div>`;
  }).join('');
}

// Where can this card legally go in the centre? Returns a pile index, or -1
// for "start a new pile", or null. Any legal pile scores the same, so the
// first match is always as good as any other.
function centreTarget(c) {
  if (c === null || c === undefined || !view) return null;
  for (let i = 0; i < view.centre.length; i++) {
    const t = view.centre[i][0];
    if (colour(c) === colour(t) && value(c) === value(t) + 1) return i;
  }
  return value(c) === 1 ? -1 : null;
}

let lastCentre = '';
function render() {
  if (!view || seat < 0) return;
  drawSeats();
  const me = view.hands[seat];

  const lit = (i) => sel !== null && centreTarget(sel) === i;
  let html = view.centre.map(([t], i) =>
    cardHTML(t, `${value(t) === 10 ? 'done' : ''} ${lit(i) ? 'ok' : ''}`).replace('<div class="card', `<div data-centre="${i}" class="card`)
  ).join('');
  // Always present, so the table is never a blank wall and new players can see
  // where a 1 is supposed to go.
  html += `<div data-centre="-1" class="card empty newpile ${lit(-1) ? 'ok' : ''}">+<small>NEW</small></div>`;
  if (html !== lastCentre) { els.centre.innerHTML = html; lastCentre = html; }

  if (!me) return;
  const stackable = (t) => sel !== null && t !== null && value(sel) === value(t) - 1 && phase(sel) !== phase(t);
  els.ready.innerHTML = me.ready.map(([t], i) =>
    `<div class="pile">${cardHTML(t, `${stackable(t) ? 'ok' : ''} ${sel === t ? 'pick' : ''}`).replace('<div class="card', `<div data-ready="${i}" class="card`)}</div>`
  ).join('');

  els.race.innerHTML = cardHTML(me.race, sel === me.race ? 'pick' : '').replace('<div class="card', '<div data-src="race" class="card') +
    `<span class="badge">${me.raceLeft}</span>`;

  // The face-up card and the flip control are separate elements. Folding them
  // into one meant that after the first flip there was no way to flip again.
  els.draw.innerHTML = (me.up === null
      ? `<div class="card empty">–</div>`
      : cardHTML(me.up, sel === me.up ? 'pick' : '').replace('<div class="card', '<div data-src="draw" class="card'));
  els.flip.innerHTML = (me.drawLeft === 0 && me.upLeft > 0 ? '↻' : '⋮') + `<span class="n">${me.drawLeft}</span>`;
  els.flip.disabled = me.drawLeft === 0 && me.upLeft === 0;
}

// ---- input -----------------------------------------------------------------

// Which of my piles is this card sitting on?
function sourceOf(c) {
  const me = view.hands[seat];
  if (c === me.race) return { from: 'race' };
  if (c === me.up) return { from: 'draw' };
  const i = me.ready.findIndex(([t]) => t === c);
  return i >= 0 ? { from: 'ready', pile: i } : null;
}

const flash = (t) => { els.hint.textContent = t; clearTimeout(flash.id); flash.id = setTimeout(() => (els.hint.textContent = ''), 1100); };

document.addEventListener('click', (e) => {
  const el = e.target.closest('#flip,[data-src],[data-ready],[data-centre]');
  if (!el || !view || seat < 0) return;
  const me = view.hands[seat];
  if (!me) return;

  if (el.id === 'flip') { sel = null; return move({ t: 'flip' }); }

  // Tapping a card plays it to the centre when it can go there. That is the
  // move you want roughly nine times in ten, so it should not cost two taps.
  if (el.dataset.src || el.dataset.ready !== undefined) {
    const c = el.dataset.src === 'race' ? me.race
            : el.dataset.src === 'draw' ? me.up
            : me.ready[+el.dataset.ready][0];

    // A ready pile with something already selected is a placement, not a pick.
    if (el.dataset.ready !== undefined && sel !== null && sel !== c) {
      const src = sourceOf(sel);
      if (!src) { sel = null; return render(); }
      if (src.from === 'ready') { sel = null; render(); return flash('Ready piles only take cards from your race or draw pile.'); }
      return move({ t: 'ready', from: src.from, pile: +el.dataset.ready });
    }

    if (c === null) return;
    const target = centreTarget(c);
    if (target !== null) { const src = sourceOf(c); return move({ t: 'centre', ...src, target }); }

    // Nowhere in the centre, so select it and light up any ready pile it fits.
    sel = sel === c ? null : c;
    render();
    if (sel !== null && !me.ready.some(([t]) => t !== null && value(sel) === value(t) - 1 && phase(sel) !== phase(t))) {
      flash('Nowhere to play that yet — turn some draw cards.');
    }
    return;
  }

  if (el.dataset.centre !== undefined) {
    if (sel === null) return flash('Tap one of your cards first.');
    const src = sourceOf(sel);
    if (!src) { sel = null; return render(); }
    return move({ t: 'centre', ...src, target: +el.dataset.centre });
  }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { sel = null; render(); } });

// ---- lobby and round end ---------------------------------------------------

function esc(s) { return String(s).replace(/[<>&]/g, (m) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m])); }

function showBanner(title, body, label, fn) {
  els.body.innerHTML = `<h3>${esc(title)}</h3><div id="bb">${body}</div>` +
    (label ? `<button class="chip" id="bx">${esc(label)}</button>` : '') +
    `<a class="chip quiet" href="/">Leave table</a>`;
  els.banner.classList.add('on');
  if (label) $('bx').addEventListener('click', fn);
}
const hideBanner = () => els.banner.classList.remove('on');

function lobby() {
  const list = roster.players.map((p) => `<li>${esc(p.name)}</li>`).join('');
  showBanner(
    `Room ${roster.code}`,
    `<p class="muted small">Share this code with up to seven others. First to ${roster.target} points wins.</p>
     <ol class="small">${list}</ol>
     <p class="small muted">${roster.players.length} of 8 seated.</p>`,
    roster.players.length >= 2 ? 'Start the round' : null,
    () => send({ t: 'start' })
  );
}

function roundEnd(m) {
  const rows = roster.players.map((p, i) =>
    `<tr><td>${esc(p.name)}</td><td>${m.deltas[i] > 0 ? '+' : ''}${m.deltas[i]}</td><td>${m.totals[i]}</td></tr>`).join('');
  const champ = m.totals.indexOf(Math.max(...m.totals));
  showBanner(
    m.gameOver ? `${roster.players[champ].name} wins` : `Round ${roster.round} to ${roster.players[m.winner]?.name ?? '—'}`,
    `<table><thead><tr><th>Player</th><th>Round</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table>`,
    m.gameOver ? null : 'Next round',
    () => send({ t: 'start' })
  );
}

connect();
</script>
</body>
</html>
