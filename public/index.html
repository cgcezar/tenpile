<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenpile — a card race for up to 8</title>
<meta name="description" content="A fast simultaneous card race for 2 to 8 players. Open the link and play.">
<meta name="theme-color" content="#523A2B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<nav class="crumbs">
  <a href="/" aria-current="page">Play</a>
  <a href="/scoresheet.html">Scoresheet</a>
  <a href="/rules.html">How to play</a>
</nav>

<main class="wrap stack">
  <div style="text-align:center">
    <div class="fan" aria-hidden="true"><i>3</i><i>7</i><i>1</i><i>9</i><i></i></div>
    <div class="plate"><span></span><h1>Tenpile</h1></div>
    <p class="muted" style="margin:.75rem 0 0">Ten cards to clear. Everyone plays at once.<br>No turns, no waiting.</p>
  </div>

  <div class="panel stack">
    <div>
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="16" placeholder="Enter your name" autocomplete="nickname">
    </div>
    <button class="chip" id="quick">Quick Play</button>
    <button class="chip quiet" id="create">Create Room</button>
  </div>

  <div class="panel stack">
    <div>
      <label for="code">Have a room code?</label>
      <input id="code" type="text" maxlength="4" placeholder="ABCD" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:.45em;font-weight:600;text-align:center">
    </div>
    <button class="chip quiet" id="join">Join Room</button>
    <p class="small muted" id="msg" role="status" aria-live="polite" style="margin:0"></p>
  </div>

  <div class="dots" style="margin-top:.25rem"><b></b><b></b><b></b><b></b></div>

  <p class="small muted" style="text-align:center">
    <a href="/rules.html">Learn the game</a> &nbsp;·&nbsp; <a href="/scoresheet.html">Offline scoresheet</a>
  </p>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const msg = $('msg');
const say = (t) => { msg.textContent = t; };

$('name').value = localStorage.getItem('tp.name') || '';
$('name').addEventListener('input', (e) => localStorage.setItem('tp.name', e.target.value.trim()));

function go(code) {
  const name = ($('name').value.trim() || 'Player').slice(0, 16);
  localStorage.setItem('tp.name', name);
  location.href = `/game.html#${code}`;
}

async function post(path) {
  const r = await fetch(path, { method: 'POST' });
  if (!r.ok) throw new Error('Server said no');
  return r.json();
}

$('quick').addEventListener('click', async () => {
  say('Finding a table…');
  try { go((await post('/api/quickplay')).code); }
  catch { say('Could not reach the server. Check your connection and try again.'); }
});

$('create').addEventListener('click', async () => {
  say('Making a room…');
  try { go((await post('/api/room')).code); }
  catch { say('Could not reach the server. Check your connection and try again.'); }
});

$('join').addEventListener('click', async () => {
  const code = $('code').value.trim().toUpperCase();
  if (!/^[A-Z2-9]{4}$/.test(code)) return say('Room codes are 4 letters or numbers.');
  say('Looking for that room…');
  try {
    const info = await (await fetch('/api/room/' + code)).json();
    if (info.error) return say(info.error);
    if (!info.joinable) return say('That room is full or already playing.');
    go(code);
  } catch { say('Could not reach the server. Check your connection and try again.'); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
